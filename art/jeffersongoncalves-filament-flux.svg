<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#27272A" stroke-width="0.6" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Backgrounds -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="950" cy="310" rx="420" ry="290" fill="url(#amberGlow)"/>

  <!-- Top label -->
  <circle cx="84" cy="70" r="4" fill="#FBBF24"/>
  <text x="98" y="74" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">FILAMENT PLUGIN</text>

  <!-- Title (1 line, fits) -->
  <text x="80" y="280" font-size="76" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Filament</text>
  <text x="80" y="356" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#amber)">Flux</text>

  <!-- Tagline -->
  <text x="80" y="412" font-size="22" font-weight="600" fill="#FBBF24">Livewire Flux UI inside Filament panels</text>

  <!-- Description (2 lines) -->
  <text x="80" y="452" font-size="18" font-weight="400" fill="#A1A1AA">Form Fields, Table Columns, Infolist Entries and</text>
  <text x="80" y="476" font-size="18" font-weight="400" fill="#A1A1AA">Actions powered by livewire/flux v2.</text>

  <!-- Footer pills -->
  <g transform="translate(80,560)">
    <!-- PHP 8.2+ -->
    <g>
      <rect width="86" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
      <text x="43" y="20" font-size="14" font-weight="500" fill="#A1A1AA" text-anchor="middle">PHP 8.2+</text>
    </g>
    <!-- Filament v5 (highlight) -->
    <g transform="translate(96,0)">
      <rect width="106" height="30" rx="15" fill="#18181B" stroke="#FBBF24"/>
      <text x="53" y="20" font-size="14" font-weight="500" fill="#FBBF24" text-anchor="middle">Filament v5</text>
    </g>
    <!-- Livewire v4 -->
    <g transform="translate(212,0)">
      <rect width="100" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
      <text x="50" y="20" font-size="14" font-weight="500" fill="#A1A1AA" text-anchor="middle">Livewire v4</text>
    </g>
    <!-- Tailwind v4 -->
    <g transform="translate(322,0)">
      <rect width="104" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
      <text x="52" y="20" font-size="14" font-weight="500" fill="#A1A1AA" text-anchor="middle">Tailwind v4</text>
    </g>
    <!-- MIT -->
    <g transform="translate(436,0)">
      <rect width="52" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
      <text x="26" y="20" font-size="14" font-weight="500" fill="#A1A1AA" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- Username corner -->
  <text x="1120" y="595" font-size="13" font-weight="500" fill="#52525B" text-anchor="end">@jeffersongoncalves</text>

  <!-- Right-side visual: form-mock -->
  <g transform="translate(680,130)">
    <!-- Container -->
    <rect width="460" height="370" rx="14" fill="#18181B" stroke="#27272A"/>

    <!-- Header label -->
    <text x="24" y="36" font-size="11" font-weight="600" letter-spacing="2" fill="#71717A">EDIT POST</text>

    <!-- Status badge top-right -->
    <g transform="translate(380,20)">
      <rect width="60" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
      <circle cx="14" cy="11" r="3" fill="#10B981"/>
      <text x="22" y="15" font-size="11" font-weight="600" fill="#10B981">PUBLISHED</text>
    </g>

    <!-- Field 1: title (filled, valid) -->
    <text x="24" y="72" font-size="11" font-weight="500" fill="#A1A1AA">Title</text>
    <rect x="24" y="80" width="412" height="38" rx="8" fill="#0A0A0B" stroke="#27272A"/>
    <text x="36" y="104" font-size="13" font-weight="500" fill="#FAFAFA">My new release</text>
    <!-- check icon -->
    <g transform="translate(412,93)">
      <circle cx="6" cy="6" r="6" fill="#10B981" fill-opacity="0.2"/>
      <path d="M 3 6 L 5.5 8.5 L 9 5" stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Field 2: slug (focused, amber border) -->
    <text x="24" y="142" font-size="11" font-weight="500" fill="#FBBF24">Slug</text>
    <rect x="24" y="150" width="412" height="38" rx="8" fill="#0A0A0B" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="36" y="174" font-size="13" font-weight="500" fill="#FAFAFA">my-new-release</text>
    <!-- copy icon -->
    <g transform="translate(404,160)">
      <rect x="0" y="3" width="12" height="14" rx="2" fill="none" stroke="#71717A" stroke-width="1.2"/>
      <rect x="4" y="0" width="12" height="14" rx="2" fill="#0A0A0B" stroke="#FBBF24" stroke-width="1.2"/>
    </g>

    <!-- Field 3 + 4: 2-col grid (Status + Priority) -->
    <text x="24" y="212" font-size="11" font-weight="500" fill="#A1A1AA">Status</text>
    <rect x="24" y="220" width="194" height="38" rx="8" fill="#0A0A0B" stroke="#27272A"/>
    <g transform="translate(36,232)">
      <rect width="64" height="18" rx="9" fill="#10B981" fill-opacity="0.15"/>
      <text x="32" y="13" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">PUBLISHED</text>
    </g>
    <!-- chevron -->
    <path d="M 200 236 l 5 5 l 5 -5" stroke="#71717A" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="242" y="212" font-size="11" font-weight="500" fill="#A1A1AA">Priority</text>
    <rect x="242" y="220" width="194" height="38" rx="8" fill="#0A0A0B" stroke="#27272A"/>
    <g transform="translate(254,232)">
      <rect width="40" height="18" rx="9" fill="#FBBF24" fill-opacity="0.15"/>
      <text x="20" y="13" font-size="10" font-weight="600" fill="#FBBF24" text-anchor="middle">HIGH</text>
    </g>
    <path d="M 418 236 l 5 5 l 5 -5" stroke="#71717A" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Switch row -->
    <text x="24" y="288" font-size="13" font-weight="500" fill="#FAFAFA">Featured post</text>
    <text x="24" y="306" font-size="11" fill="#71717A">Pin to homepage</text>
    <g transform="translate(396,278)">
      <rect width="40" height="22" rx="11" fill="#FBBF24"/>
      <circle cx="29" cy="11" r="8" fill="#FAFAFA"/>
    </g>

    <!-- Footer buttons -->
    <rect x="24" y="320" width="412" height="1" fill="#27272A"/>
    <g transform="translate(24,332)">
      <rect width="92" height="30" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="46" y="20" font-size="12" font-weight="500" fill="#A1A1AA" text-anchor="middle">Cancel</text>
    </g>
    <g transform="translate(344,332)">
      <rect width="92" height="30" rx="8" fill="url(#amber)"/>
      <text x="46" y="20" font-size="12" font-weight="600" fill="#0A0A0B" text-anchor="middle">Save</text>
    </g>
  </g>
</svg>
